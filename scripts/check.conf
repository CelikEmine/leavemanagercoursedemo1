# Leave Manager verification contract.
# Local fast is runnable with Java 17 and Node.js 22.
# Full runs in CI with the PostgreSQL service and Playwright's browser.

requires backend-compile: java -version 2>&1 | grep -Eq 'version "17[."]'
requires frontend-dependencies: node -e "process.exit(process.versions.node.split('.')[0] === '22' ? 0 : 1)"
requires backend-integration: test "${CI:-}" = "true" && node -e "const s=require('net').connect(5432,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
requires frontend-e2e-browser: test "${CI:-}" = "true"
requires frontend-e2e: test "${CI:-}" = "true"

# resource hygiene: Maven runs without a persistent daemon.
backend-compile [fast]: ./mvnw -B -ntp -DskipTests compile
backend-lint [fast]: ./mvnw -B -ntp spotless:check
backend-unit [fast]: ./mvnw -B -ntp test
frontend-dependencies [fast]: npm ci --prefix frontend
frontend-lint [fast]: npm run lint --prefix frontend
frontend-unit [fast]: npm run test:unit --prefix frontend
frontend-build [fast]: npm run build --prefix frontend

# Integration tests connect only to the per-job CI PostgreSQL service.
# resource hygiene: the CI service lifecycle is owned by GitHub Actions, not this step.
backend-integration: ./mvnw -B -ntp -DskipUnitTests=true verify

# resource hygiene: Playwright installs one browser; no browser process is started here.
frontend-e2e-browser: cd frontend && npx playwright install --with-deps chromium

# resource hygiene: Playwright runs one worker; webServer owns and stops both app processes.
frontend-e2e: npm run test:e2e --prefix frontend
